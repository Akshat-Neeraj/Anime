// ── APPLICATION FUNNEL (combines Jobs + DM Log + Rejections) ─────────────────
function buildJobFunnel(){
  var jobs=S.jobs||[];
  var dms=S.dmTracker||[];
  var rejs=S.rejections||[];
  var jApplied=jobs.filter(function(j){return j.status==='Applied';}).length;
  var jInterview=jobs.filter(function(j){return j.status==='Interview';}).length;
  var jOffer=jobs.filter(function(j){return j.status==='Offer';}).length;
  var jRejected=jobs.filter(function(j){return j.status==='Rejected';}).length;
  var dPending=dms.filter(function(d){return d.status==='Pending';}).length;
  var dOpened=dms.filter(function(d){return d.status==='Opened';}).length;
  var dReplied=dms.filter(function(d){return d.status==='Replied';}).length;
  var dGhosted=dms.filter(function(d){return d.status==='Ghosted';}).length;
  var totalOutreach=jobs.length+dms.length;
  var totalResponses=jInterview+jOffer+dReplied;
  var replyRate=totalOutreach?Math.round(totalResponses/totalOutreach*100):0;
  var stuckAtFirstContact=jApplied+dPending+dOpened;

  var diag='';
  if(totalOutreach===0){
    diag='No applications or DMs logged yet. Start tracking in Jobs and DM Log to see where things stand.';
  }else if(totalResponses===0){
    diag='0% reply rate across '+totalOutreach+' total attempts ('+jobs.length+' job application'+(jobs.length===1?'':'s')+' + '+dms.length+' DM'+(dms.length===1?'':'s')+'). Every single one is stuck at first contact — this points at the application/message itself not passing initial screening, not at interview performance (you haven\'t reached one yet).';
  }else if(replyRate<10){
    diag=replyRate+'% reply rate across '+totalOutreach+' attempts. '+stuckAtFirstContact+' are still stuck at first contact with no response at all — the bottleneck is getting noticed, not what happens after.';
  }else{
    diag=replyRate+'% reply rate across '+totalOutreach+' attempts, with '+totalResponses+' response'+(totalResponses===1?'':'s')+' so far. Keep the volume up — this is trending in the right direction.';
  }

  return'<div>'+
    '<div style="background:rgba(251,146,60,.06);border:1px solid rgba(251,146,60,.2);border-radius:13px;padding:14px;margin-bottom:11px">'+
      '<div style="font-size:10px;font-weight:700;color:#fb923c;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px">🔻 Where applications actually go</div>'+
      '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:12px">'+
        [['📤',totalOutreach,'Total outreach','#818cf8'],['✅',totalResponses,'Responses','#10b981'],['📊',replyRate+'%','Reply rate','#fb923c']].map(function(s){return'<div style="background:'+s[3]+'0d;border:1px solid '+s[3]+'22;border-radius:10px;padding:9px 4px;text-align:center"><div style="font-size:16px">'+s[0]+'</div><div style="font-size:17px;font-weight:800;color:'+s[3]+';font-family:\'JetBrains Mono\',monospace">'+s[1]+'</div><div style="font-size:9px;color:#4b5563">'+s[2]+'</div></div>'}).join('')+
      '</div>'+
      '<div style="font-size:12px;color:'+(replyRate===0&&totalOutreach>0?'#fca5a5':'#9ca3af')+';line-height:1.7;padding:10px;background:rgba(255,255,255,.02);border-radius:9px">'+diag+'</div>'+
    '</div>'+
    '<div style="background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:13px;margin-bottom:10px">'+
      '<div style="font-size:10px;font-weight:700;color:#374151;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px">Job Applications ('+jobs.length+')</div>'+
      buildFunnelBar([['Applied',jApplied,'#3b82f6'],['Interview',jInterview,'#f59e0b'],['Offer',jOffer,'#10b981'],['Rejected',jRejected,'#ef4444']],jobs.length)+
    '</div>'+
    '<div style="background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:13px;margin-bottom:10px">'+
      '<div style="font-size:10px;font-weight:700;color:#374151;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px">Cold DMs ('+dms.length+')</div>'+
      buildFunnelBar([['Pending',dPending,'#f59e0b'],['Opened',dOpened,'#60a5fa'],['Replied',dReplied,'#10b981'],['Ghosted',dGhosted,'#ef4444']],dms.length)+
    '</div>'+
    buildSourceBreakdown(jobs)+
    (rejs.length?'<div style="background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:13px;margin-bottom:10px">'+
      '<div style="font-size:10px;font-weight:700;color:#374151;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px">Recent Rejection Reasons ('+rejs.length+' logged)</div>'+
      rejs.filter(function(r){return r.reason;}).slice(-4).reverse().map(function(r){return'<div style="font-size:11.5px;color:#9ca3af;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.05);line-height:1.6"><span style="color:#e2e8f0;font-weight:600">'+esc(r.company)+':</span> '+esc(r.reason)+'</div>';}).join('')+
      (rejs.filter(function(r){return r.reason;}).length===0?'<div style="font-size:11.5px;color:#374151">No reasons logged yet — add a "what did you learn" note next time in Rejections.</div>':'')+
    '</div>':'')+
    '<div style="background:rgba(99,102,241,.06);border:1px solid rgba(99,102,241,.18);border-radius:12px;padding:13px">'+
      '<button id="funnelAIBtn" '+(totalOutreach===0?'disabled':'')+' style="width:100%;background:'+(S.funnelLoading?'rgba(99,102,241,.1)':'linear-gradient(135deg,rgba(99,102,241,.2),rgba(99,102,241,.08))')+';border:1px solid rgba(99,102,241,.3);border-radius:9px;padding:10px;color:#818cf8;font-size:12.5px;font-weight:700;'+(totalOutreach===0?'opacity:.5':'')+'">'+(S.funnelLoading?'🤖 Analyzing...':'🤖 Diagnose the full funnel')+'</button>'+
      (S.funnelInsight?'<div style="margin-top:10px;font-size:12.5px;color:#a5b4fc;line-height:1.7;white-space:pre-wrap">'+esc(S.funnelInsight)+'</div>':'')+
    '</div>'+
  '</div>';
}
function buildSourceBreakdown(jobs){
  var withSource=jobs.filter(function(j){return j.source;});
  if(withSource.length<2)return'';
  var bySrc={};
  withSource.forEach(function(j){
    if(!bySrc[j.source])bySrc[j.source]={total:0,responded:0};
    bySrc[j.source].total++;
    if(j.status==='Interview'||j.status==='Offer')bySrc[j.source].responded++;
  });
  var rows=Object.keys(bySrc).map(function(s){return{s:s,total:bySrc[s].total,rate:Math.round(bySrc[s].responded/bySrc[s].total*100)};});
  rows.sort(function(a,b){return b.rate-a.rate;});
  var colFor=function(v){return v===0?'#ef4444':v<20?'#fb923c':'#10b981';};
  var best=rows[0];
  return'<div style="background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:13px;margin-bottom:10px">'+
    '<div style="font-size:10px;font-weight:700;color:#374151;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px">By Channel — which one actually works</div>'+
    rows.map(function(r){return'<div style="display:flex;align-items:center;gap:8px;margin-bottom:7px">'+
      '<span style="font-size:11px;color:#9ca3af;width:85px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(r.s)+' ('+r.total+')</span>'+
      '<div style="flex:1;height:7px;background:rgba(255,255,255,.06);border-radius:6px;overflow:hidden"><div style="height:100%;width:'+r.rate+'%;background:'+colFor(r.rate)+';border-radius:6px"></div></div>'+
      '<span style="font-size:11px;color:'+colFor(r.rate)+';font-weight:700;width:34px;text-align:right;flex-shrink:0">'+r.rate+'%</span>'+
    '</div>';}).join('')+
    (best&&best.rate>0?'<div style="font-size:11px;color:#6b7280;margin-top:6px">💡 '+esc(best.s)+' is your best-performing channel so far ('+best.rate+'% reply rate over '+best.total+' applications).</div>':'')+
  '</div>';
}
function buildFunnelBar(stages,total){
  return stages.map(function(s){var pct=total?Math.round(s[1]/total*100):0;return'<div style="margin-bottom:8px">'+
    '<div style="display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:3px"><span style="color:#9ca3af">'+s[0]+'</span><span style="color:'+s[2]+';font-weight:700">'+s[1]+' ('+pct+'%)</span></div>'+
    '<div style="height:7px;background:rgba(255,255,255,.06);border-radius:6px;overflow:hidden"><div style="height:100%;width:'+pct+'%;background:'+s[2]+';border-radius:6px"></div></div>'+
  '</div>';}).join('');
}

function bindLearningTimer(){
  document.querySelectorAll('.learnSub').forEach(function(b){b.onclick=function(){S.learning=Object.assign({},S.learning,{subject:b.dataset.s});renderPage();};});
  var tas=document.getElementById('toggleAddSubject');

  var nsi=document.getElementById('newSubjectInp');
  if(nsi)nsi.oninput=function(e){S.newSubject=e.target.value;};
  function addSubject(){
    var nm=(S.newSubject||'').trim();
    if(!nm)return;
    var builtIn=['JavaScript','React','CSS','Node.js','DSA','System Design','TypeScript','Python','Git'];
    var all=builtIn.concat(S.customSubjects||[]);
    if(all.some(function(s){return s.toLowerCase()===nm.toLowerCase()})){
      S.newSubject='';renderPage();toast('Already in the list');return;
    }
    S.customSubjects=(S.customSubjects||[]).concat([nm]);
    S.newSubject='';
    DB.set('customSubjects',S.customSubjects);renderPage();
  }
  var asb=document.getElementById('addSubjectBtn');
  if(asb)asb.onclick=addSubject;
  if(nsi)nsi.onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();addSubject();}};
  document.querySelectorAll('.rmSubject').forEach(function(b){
    b.onclick=function(e){
      e.stopPropagation();
      var s=b.dataset.s;
      S.customSubjects=(S.customSubjects||[]).filter(function(x){return x!==s;});
      // Clear the selection if the removed subject was the one selected —
      // otherwise "Start Learning Session" would silently start a session
      // for a subject that no longer appears anywhere in the list.
      if(S.learning&&S.learning.subject===s)S.learning=Object.assign({},S.learning,{subject:''});
      DB.set('customSubjects',S.customSubjects);renderPage();
    };
  });
  var ls=document.getElementById('learnStart');
  if(ls)ls.onclick=function(){if(!S.learning.subject)return;S.learning={active:true,subject:S.learning.subject,startedAt:Date.now()};renderPage();
    if(window._learnInterval)clearInterval(window._learnInterval);
    window._learnInterval=setInterval(function(){var el=document.getElementById('learnTimerEl');if(el&&S.learning.active){var e=Math.floor((Date.now()-S.learning.startedAt)/60000);el.textContent=e+'min';}else if(!S.learning.active){clearInterval(window._learnInterval);}},30000);
  };
  var stop=document.getElementById('learnStop');
  if(stop)stop.onclick=function(){
    var mins=Math.max(1,Math.floor((Date.now()-S.learning.startedAt)/60000));
    var sub=S.learning.subject;
    S.learnLog=S.learnLog||{};
    S.learnLog[toDay()]=(S.learnLog[toDay()]||[]).concat([{sub:sub,mins:mins}]);
    DB.set('learnLog',S.learnLog);
    S.xp+=Math.floor(mins/25)*10;save();
    S.learning={active:false,subject:sub,startedAt:null};
    renderPage();
  };
}

function buildHealthScore(){
  var slY=DB.get('sleep:'+toYest())||{};

  var cal=meals.reduce(function(s,m){return s+(m.calories||0)},0);

  var recentW=(S.workoutLog||[]).filter(function(w){return w.date!==toDay()});
  var lastWDate=recentW.length?recentW[recentW.length-1].date:'';
  var daysSince=lastWDate?(dLeft(lastWDate)*-1):999;
  var water=S.water||0;
  // Compute health score
  var sleepS=Math.min(30,Math.round(((slY.q||0)/5)*30));
  var protS=Math.min(25,Math.round((prot/160)*25));
  var workS=todayW.length>0?20:(daysSince<=1?15:daysSince<=2?8:0);

  var habS=Math.min(10,Math.round((S.habits.filter(function(h){return S.checked[h.id]==='done'}).length/Math.max(1,S.habits.length))*10));

  var color=total>=80?'#10b981':total>=60?'#60a5fa':total>=40?'#f59e0b':'#ef4444';
  var label=total>=80?'Great 💪':total>=60?'Good 👍':total>=40?'Okay 😐':'Poor 🚨';
  // History
  var hist=[];
  for(var i=6;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);var dk=toLocalDate(d);var v=DB.get('healthScore:'+dk);if(v!==null&&v!==undefined)hist.push({d:dk.slice(5),v:v});}

  DB.set('healthScore:'+toDay(),total);

    '</div>'+
    '<div style="height:5px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden;margin-bottom:6px">'+
      '<div style="height:100%;width:'+total+'%;background:'+color+';border-radius:3px"></div>'+
    '</div>'+
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px">'+
      '<div style="font-size:11px;color:'+color+';font-weight:700">'+label+'</div>'+
      '<div style="font-size:9.5px;color:#374151">Sleep '+sleepS+' · Protein '+protS+' · Workout '+workS+' · Water '+waterS+' · Habits '+habS+'</div>'+
    '</div>'+
    (hist.length>=2?'<div style="display:flex;align-items:flex-end;gap:3px;height:24px">'+
      hist.map(function(h){var hc=h.v>=80?'#10b981':h.v>=60?'#60a5fa':h.v>=40?'#f59e0b':'#ef4444';return'<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:1px"><div style="width:100%;height:'+h.v+'%;background:'+hc+';border-radius:2px;min-height:2px;opacity:.8"></div><div style="font-size:7px;color:#374151">'+h.d.slice(3)+'</div></div>'}).join('')+

// ── MOOD vs PRODUCTIVITY CHART ────────────────────────────────────────────────
function buildMoodProductivity(){
  var data=[];
  for(var i=29;i>=0;i--){
    var d=new Date();d.setDate(d.getDate()-i);var dk=toLocalDate(d);
    var mood=DB.get('mood:'+dk);
    var dd=DB.get('day:'+dk)||{};
    var habPct=dd.c&&S.habits.length?Math.round(Object.values(dd.c).filter(function(v){return v==='done'||v===true;}).length/S.habits.length*100):null;
    if(mood!==null&&mood!==undefined&&habPct!==null)data.push({d:dk.slice(5),mood:mood,prod:habPct});
  }
  if(data.length<5)return'<div style="background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:14px;margin-bottom:10px"><div style="font-size:10px;font-weight:700;color:#374151;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px">😊 Mood vs Productivity</div><div style="font-size:12px;color:#374151;text-align:center;padding:12px 0">Need 5+ days of both mood + habits logged to show correlation.</div></div>';
  // Compute correlation
  var avgMood=data.reduce(function(s,d){return s+d.mood},0)/data.length;
  var avgProd=data.reduce(function(s,d){return s+d.prod},0)/data.length;
  var corr=0;var dm=0;var dp=0;
  data.forEach(function(d){corr+=(d.mood-avgMood)*(d.prod-avgProd);dm+=(d.mood-avgMood)*(d.mood-avgMood);dp+=(d.prod-avgProd)*(d.prod-avgProd);});
  var r=dm&&dp?Math.round((corr/Math.sqrt(dm*dp))*100)/100:0;
  var corrText=r>0.5?'Strong positive — when you feel good, you do more':r>0.2?'Weak positive — mood slightly helps':r<-0.5?'Strong negative — you grind harder when feeling bad':r<-0.2?'Weak negative — mood doesn\'t help much':'No clear pattern yet';
  var W=320,H=100,PX=20,PY=10;
  var moodPts=data.map(function(d,i){return{x:PX+(i/(data.length-1||1))*(W-PX*2),y:H-PY-(((d.mood-1)/4)*(H-PY*2)),v:d.mood};});
  var prodPts=data.map(function(d,i){return{x:PX+(i/(data.length-1||1))*(W-PX*2),y:H-PY-((d.prod/100)*(H-PY*2)),v:d.prod};});
  var mPath=moodPts.map(function(p,i){return(i===0?'M':'L')+p.x.toFixed(1)+','+p.y.toFixed(1)}).join(' ');
  var pPath=prodPts.map(function(p,i){return(i===0?'M':'L')+p.x.toFixed(1)+','+p.y.toFixed(1)}).join(' ');
  return'<div style="background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:13px;padding:14px;margin-bottom:10px">'+
    '<div style="font-size:10px;font-weight:700;color:#374151;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px">😊 Mood vs Productivity</div>'+
    '<div style="font-size:11px;color:#6b7280;margin-bottom:10px">Correlation: <span style="color:'+(r>0.2?'#10b981':r<-0.2?'#f59e0b':'#6b7280')+';font-weight:700">r='+r+'</span> — '+corrText+'</div>'+
    '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:100px;overflow:visible">'+
      '<path d="'+mPath+'" fill="none" stroke="#f472b6" stroke-width="2" stroke-linecap="round" opacity=".8"/>'+
      '<path d="'+pPath+'" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" opacity=".8"/>'+
    '</svg>'+
    '<div style="display:flex;gap:12px;margin-top:4px">'+
      '<div style="display:flex;align-items:center;gap:4px"><div style="width:12px;height:2px;background:#f472b6;border-radius:1px"></div><span style="font-size:10px;color:#6b7280">Mood</span></div>'+
      '<div style="display:flex;align-items:center;gap:4px"><div style="width:12px;height:2px;background:#60a5fa;border-radius:1px"></div><span style="font-size:10px;color:#6b7280">Habits %</span></div>'+
      '<div style="font-size:10px;color:#374151;margin-left:auto">'+data.length+' days</div>'+
    '</div>'+
  '</div>';
}

// ── WEEKLY TREND DASHBOARD ────────────────────────────────────────────────────
// This-week-vs-last-week numeric comparison, distinct from War Report (which is
// an AI-written narrative). Pure data, no AI call — answers "am I actually
// improving" at a glance. Reuses the same per-day DB keys War Report already
// reads (day:, shadow:, sleep:, mood:) plus S.jobs/S.dmTracker for career metrics.
function computeWeekWindow(startOffset){
  // startOffset: 0 = days 6..0 ago (this week), 7 = days 13..7 ago (last week)
  var days=[];
  for(var i=startOffset+6;i>=startOffset;i--){
    var d=new Date();d.setDate(d.getDate()-i);var dk=toLocalDate(d);
    var dd=DB.get('day:'+dk)||{};
    var doneIds=dd.c?Object.keys(dd.c).filter(function(k){return dd.c[k]==='done'||dd.c[k]===true;}):[];
    var xp=doneIds.reduce(function(s,id){var h=S.habits.find(function(x){return x.id===id});return s+(h?h.xp:0);},0);
    var sl=DB.get('sleep:'+dk)||{};
    var mood=DB.get('mood:'+dk);
    days.push({date:dk,habDone:doneIds.length,xp:xp,sleepQ:sl.q||null,mood:(mood===null||mood===undefined)?null:mood});
  }
  var habTotal=S.habits.length||1;
  var habPct=Math.round(days.reduce(function(s,d){return s+d.habDone},0)/(7*habTotal)*100);
  var xpSum=days.reduce(function(s,d){return s+d.xp},0);
  var sleepVals=days.filter(function(d){return d.sleepQ!==null;}).map(function(d){return d.sleepQ;});
  var sleepAvg=sleepVals.length?Math.round(sleepVals.reduce(function(s,v){return s+v;},0)/sleepVals.length*10)/10:null;
  var moodVals=days.filter(function(d){return d.mood!==null;}).map(function(d){return d.mood;});
  var moodAvg=moodVals.length?Math.round(moodVals.reduce(function(s,v){return s+v;},0)/moodVals.length*10)/10:null;
  var lo=days[0].date,hi=days[days.length-1].date;
  var jobsCount=(S.jobs||[]).filter(function(j){return j.date>=lo&&j.date<=hi;}).length;
  var dmsCount=(S.dmTracker||[]).filter(function(d){return d.date>=lo&&d.date<=hi;}).length;
  return{habPct:habPct,xp:xpSum,sleepAvg:sleepAvg,moodAvg:moodAvg,jobs:jobsCount,dms:dmsCount};
}
function trendBarRow(label,cur,prev,unit,color,higherIsBetter){
  var curV=cur===null?0:cur, prevV=prev===null?0:prev;
  var maxV=Math.max(curV,prevV,1);
  var curPct=Math.round(curV/maxV*100), prevPct=Math.round(prevV/maxV*100);
  var delta=cur===null||prev===null?null:cur-prev;
  var deltaStr=delta===null?'no prior data':( (delta>0?'+':'')+(Number.isInteger(delta)?delta:delta.toFixed(1))+unit);
  var good=delta===null?'#6b7280':(delta===0?'#6b7280':((delta>0)===!!higherIsBetter?'#10b981':'#ef4444'));
  return'<div style="margin-bottom:10px">'+
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3px">'+
      '<span style="font-size:11px;color:#9ca3af;font-weight:600">'+label+'</span>'+
      '<span style="font-size:11px;font-weight:700;color:'+good+';font-family:\'JetBrains Mono\',monospace">'+deltaStr+'</span>'+
    '</div>'+
    '<div style="display:flex;align-items:center;gap:6px;margin-bottom:2px">'+
      '<div style="width:38px;font-size:9px;color:#374151;text-align:right;flex-shrink:0">now</div>'+
      '<div style="flex:1;background:rgba(255,255,255,.05);border-radius:5px;height:9px;overflow:hidden"><div style="width:'+curPct+'%;height:100%;background:'+color+';border-radius:5px"></div></div>'+
      '<div style="width:34px;font-size:10px;color:#e2e8f0;font-weight:700;font-family:\'JetBrains Mono\',monospace;flex-shrink:0">'+(cur===null?'—':cur+unit)+'</div>'+
    '</div>'+
    '<div style="display:flex;align-items:center;gap:6px">'+
      '<div style="width:38px;font-size:9px;color:#374151;text-align:right;flex-shrink:0">prior</div>'+
      '<div style="flex:1;background:rgba(255,255,255,.05);border-radius:5px;height:9px;overflow:hidden"><div style="width:'+prevPct+'%;height:100%;background:'+color+';opacity:.4;border-radius:5px"></div></div>'+
      '<div style="width:34px;font-size:10px;color:#6b7280;font-weight:600;font-family:\'JetBrains Mono\',monospace;flex-shrink:0">'+(prev===null?'—':prev+unit)+'</div>'+
    '</div>'+
  '</div>';
}

// ── CONSISTENCY SCORES ────────────────────────────────────────────────────────
function buildConsistencyScores(){
  var habits=S.habits;if(!habits.length)return'';
  var scores={};
  habits.forEach(function(h){scores[h.id]={lbl:h.lbl,done:0,total:0};});
  for(var i=29;i>=0;i--){
    var d=new Date();d.setDate(d.getDate()-i);var dk=toLocalDate(d);
    var dd=DB.get('day:'+dk)||{};
    habits.forEach(function(h){if(dd.c){scores[h.id].total++;if(dd.c[h.id])scores[h.id].done++;}});
  }
  var sorted=habits.map(function(h){var s=scores[h.id];var pct=s.total?Math.round(s.done/s.total*100):0;return{lbl:h.lbl,pct:pct,done:s.done,total:s.total};}).sort(function(a,b){return b.pct-a.pct});
  return'<div style="background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:13px;padding:13px;margin-bottom:10px">'+
    '<div style="font-size:10px;font-weight:700;color:#374151;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px">📊 Habit Consistency (30 days)</div>'+
    sorted.map(function(h){var c=h.pct>=80?'#10b981':h.pct>=60?'#f59e0b':h.pct>=40?'#fb923c':'#ef4444';return'<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;margin-bottom:3px"><span style="font-size:12px;color:#e2e8f0">'+esc(h.lbl)+'</span><span style="font-size:11px;font-weight:700;color:'+c+';font-family:\'JetBrains Mono\',monospace">'+h.pct+'%</span></div><div style="height:5px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden"><div style="height:100%;width:'+h.pct+'%;background:'+c+';border-radius:3px;transition:width .4s"></div></div><div style="font-size:9px;color:#374151;margin-top:2px">'+h.done+'/'+h.total+' days</div></div>'}).join('')+
  '</div>';
}

function bindVoiceNotes(){
  document.querySelectorAll('.vnDel').forEach(function(b){b.onclick=function(){var id=parseInt(b.dataset.vid);S.voiceNotes=S.voiceNotes.filter(function(n){return n.id!==id});DB.set('voiceNotes',S.voiceNotes);rT();};});
  var rec=document.getElementById('vnRecord');
  if(!rec)return;
  if(!('webkitSpeechRecognition' in window)&&!('SpeechRecognition' in window)){rec.textContent='🎤 Voice not supported (use Chrome)';rec.disabled=true;return;}
  rec.onclick=function(){
    if(S.voiceRecording){if(window._vnSR)window._vnSR.stop();return;}
    var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    var sr=new SR();window._vnSR=sr;
    sr.lang='en-IN';sr.continuous=false;sr.interimResults=false;
    S.voiceRecording=true;rT();
    sr.onresult=async function(e){
      var transcript=e.results[0][0].transcript;
      S.voiceRecording=false;
      var note={id:Date.now(),text:transcript,date:toDay(),time:new Date().toTimeString().slice(0,5),summary:''};
      S.voiceNotes=(S.voiceNotes||[]).concat([note]);DB.set('voiceNotes',S.voiceNotes);rT();
      try{
        var sys='In one short sentence (max 12 words), what is the key point of this note: "'+transcript+'"';
        var sum=await callAI([{role:'user',content:transcript}],sys,false,null);
        S.voiceNotes=S.voiceNotes.map(function(n){return n.id===note.id?Object.assign({},n,{summary:sum.trim()}):n;});
        DB.set('voiceNotes',S.voiceNotes);rT();
      }catch(e2){}
    };
    sr.onerror=function(){S.voiceRecording=false;rT();};
    sr.onend=function(){S.voiceRecording=false;rT();};
    sr.start();

function doUniversalSearch(q){
  if(!q||q.length<2){S.uSearchResults=[];return;}
  var ql=q.toLowerCase();var results=[];
  // Brain entries
  (S.brain||[]).forEach(function(i){if(i.text.toLowerCase().includes(ql))results.push({type:'Brain',icon:'🧠',title:i.text.slice(0,60),sub:i.tag+' · '+i.date,id:i.id});});
  // Journal entries
  for(var ji=29;ji>=0;ji--){var jd=new Date();jd.setDate(jd.getDate()-ji);var jdk=toLocalDate(jd);var je=DB.get('journal:'+jdk);if(je){['q1','q2','q3','q4'].forEach(function(k){if(je[k]&&je[k].toLowerCase().includes(ql))results.push({type:'Journal',icon:'📓',title:(je[k]||'').slice(0,60),sub:'Journal · '+jdk});});}}
  // DM Log
  (S.dmTracker||[]).forEach(function(d){if((d.who+d.note).toLowerCase().includes(ql))results.push({type:'DM',icon:'📬',title:d.who+' · '+d.platform,sub:d.status+' · '+d.date});});
  // Rejections
  (S.rejections||[]).forEach(function(r){if((r.company+r.role+r.reason).toLowerCase().includes(ql))results.push({type:'Rejection',icon:'💪',title:r.company+' · '+r.role,sub:r.status+' · '+r.date});});
  // Habits
  (S.habits||[]).forEach(function(h){if(h.lbl.toLowerCase().includes(ql))results.push({type:'Habit',icon:'✅',title:h.lbl,sub:'XP: '+h.xp});});
  // Voice notes
  (S.voiceNotes||[]).forEach(function(n){if(n.text.toLowerCase().includes(ql))results.push({type:'Voice',icon:'🎤',title:n.text.slice(0,60),sub:n.date+' '+n.time});});
  // Fail log
  (S.failLog||[]).forEach(function(f){if(f.text.toLowerCase().includes(ql))results.push({type:'Fail',icon:'📝',title:f.text.slice(0,60),sub:f.date});});
  // Capture
  (S.capture||[]).forEach(function(c){if(c.t.toLowerCase().includes(ql))results.push({type:'Capture',icon:'💭',title:c.t.slice(0,60),sub:c.d});});
  // Ideas + Bookmarks
  (S.ideas||[]).forEach(function(i){if((i.text+' '+(i.tag||'')+' '+(i.url||'')).toLowerCase().includes(ql))results.push({type:i.type==='bookmark'?'Bookmark':'Idea',icon:i.type==='bookmark'?'🔖':'💡',title:i.text.slice(0,60),sub:(i.tag?'#'+i.tag+' · ':'')+i.date});});
  S.uSearchResults=results.slice(0,20);
}

function computeCheckinStreak(){
  // Recomputed fresh from actual checkin:DATE history each time — self-healing,
  // immune to any stored-counter drift, always matches what the calendar shows.
  var checkedToday=DB.get('checkin:'+toDay());
  var count=0;
  var startOffset=checkedToday?0:1;// if not checked in today yet, count the run ending yesterday
  for(var i=startOffset;i<3650;i++){
    var d=new Date();d.setDate(d.getDate()-i);
    var dk=toLocalDate(d);
    if(DB.get('checkin:'+dk))count++;
    else break;
  }
  return count;
}

// ── EXPORT / IMPORT DATA ─────────────────────────────────────────────────────
function exportAllData(){
  var data={};
  for(var i=0;i<localStorage.length;i++){
    var k=localStorage.key(i);
    try{data[k]=JSON.parse(localStorage.getItem(k));}
    catch(e){data[k]=localStorage.getItem(k);}
  }
  var json=JSON.stringify(data,null,2);
  var blob=new Blob([json],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;a.download='akshat-os-backup-'+toDay()+'.json';
  document.body.appendChild(a);a.click();
  document.body.removeChild(a);URL.revokeObjectURL(url);
}
function importAllData(file){
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var data=JSON.parse(e.target.result);
      var count=0;
      Object.keys(data).forEach(function(k){
        try{localStorage.setItem(k,JSON.stringify(data[k]));count++;}catch(err){}
      });
      toast('✅ Imported '+count+' items. Refreshing...','success');
      setTimeout(function(){location.reload();},900);
    }catch(err){toast('❌ Invalid backup file: '+err.message,'error');}
  };
  reader.readAsText(file);
}
function csvEscape(v){
  v=(v===null||v===undefined)?'':String(v);
  if(/[",\n]/.test(v))return'"'+v.replace(/"/g,'""')+'"';
  return v;
}
function downloadCSV(filename,rows){
  var csv=rows.map(function(r){return r.map(csvEscape).join(',');}).join('\n');
  var blob=new Blob([csv],{type:'text/csv'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');a.href=url;a.download=filename;a.click();
  setTimeout(function(){URL.revokeObjectURL(url);},1000);
}
function exportNutritionFitnessCSV(){
  // Meal log is stored per-day under 'mealLog:YYYY-MM-DD' keys, not one
  // combined array — walk localStorage to collect every day's entries.
  var mealRows=[['date','food','protein_g','calories']];
  for(var i=0;i<localStorage.length;i++){
    var k=localStorage.key(i);
    if(k&&k.indexOf('ao:mealLog:')===0){
      var date=k.slice('ao:mealLog:'.length);
      var entries=DB.get('mealLog:'+date)||[];
      entries.forEach(function(m){mealRows.push([date,m.name,m.protein,m.calories]);});
    }
  }
  downloadCSV('akshat-os-nutrition-log.csv',mealRows);
  var workoutRows=[['date','exercise','sets','reps','weight_kg']];
  (S.workoutLog||[]).forEach(function(w){workoutRows.push([w.date,w.exercise,w.sets,w.reps,w.weight]);});
  downloadCSV('akshat-os-fitness-log.csv',workoutRows);
}
function exportNutritionFitnessPDF(){
  var byDate={};
  for(var i=0;i<localStorage.length;i++){
    var k=localStorage.key(i);
    if(k&&k.indexOf('ao:mealLog:')===0){
      var date=k.slice('ao:mealLog:'.length);
      byDate[date]=byDate[date]||{meals:[],protein:0,calories:0};
      (DB.get('mealLog:'+date)||[]).forEach(function(m){byDate[date].meals.push(m.name+' — '+m.protein+'g/'+m.calories+'kcal');byDate[date].protein+=m.protein||0;byDate[date].calories+=m.calories||0;});
    }
  }
  var workoutsByDate={};
  (S.workoutLog||[]).forEach(function(w){(workoutsByDate[w.date]=workoutsByDate[w.date]||[]).push(w.exercise+' — '+w.sets+'x'+w.reps+(w.weight?'@'+w.weight+'kg':''));});
  var allDates=Object.keys(byDate).concat(Object.keys(workoutsByDate)).filter(function(v,i,a){return a.indexOf(v)===i;}).sort().reverse();
  var content='## Summary\n'+allDates.length+' days logged\n\n';
  allDates.forEach(function(d){
    content+='## '+d+'\n';
    if(byDate[d])content+='Nutrition: '+Math.round(byDate[d].protein)+'g protein / '+Math.round(byDate[d].calories)+' kcal\n'+byDate[d].meals.join('\n')+'\n';
    if(workoutsByDate[d])content+='Workout:\n'+workoutsByDate[d].join('\n')+'\n';
    content+='\n';
  });
  generatePDF('Nutrition + Fitness Report',content||'No entries logged yet.');
}

function getSleepWeek(){
  var days=[];
  for(var i=6;i>=0;i--){
    var d=new Date();d.setDate(d.getDate()-i);
    var dk=toLocalDate(d);
    var sl=DB.get('sleep:'+dk);
    var dayName=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()];
    days.push({label:i===0?'Today':dayName,q:sl?sl.q:0,t:sl?sl.t:'',key:dk});
  }
  return days;
}

function bindFocus(){

  document.querySelectorAll('.ytmcard').forEach(function(card){

      var titleInp=document.querySelector('.ytNewTitle[data-mood="'+mood+'"]');
      var artistInp=document.querySelector('.ytNewArtist[data-mood="'+mood+'"]');
      var title=titleInp?titleInp.value.trim():'';
      if(!title)return;
      var artist=artistInp?artistInp.value.trim():'';
      if(!S.moodTracks[mood]){
        var def=YT_MOODS.find(function(m){return m.l===mood;});
        S.moodTracks[mood]=def?def.tracks.slice():[];
      }
      S.moodTracks[mood]=S.moodTracks[mood].concat([{t:title,a:artist||'Custom',url:'https://music.youtube.com/search?q='+encodeURIComponent(title+' '+artist)}]);
      DB.set('moodTracks',S.moodTracks);renderPage();
    };
  });
  // Mode toggle
  document.querySelectorAll('.focmode').forEach(function(b){
    b.onclick=function(){
      if(S.focus.running)return;
      S.focus.mode=b.dataset.m;
      S.focus.secs=0;
      renderPage();
    };
  });

  // Mission edit button
  var em=document.getElementById('editMissionBtn');
  if(em)em.onclick=function(){
    document.getElementById('page').innerHTML=buildMissionModal();
    bindMissionModal();
  };

  // Start/Pause
  var fs=document.getElementById('focStart');
  if(fs)fs.onclick=function(){
    if(S.focus.running){
      // Pause
      clearInterval(S.focus.interval);
      S.focus.running=false;
      S.focus.secs=(Date.now()-S.focus.startedAt)/1000|0;
      renderPage();
    } else {
      // Start
      var WORK=25*60,REST=5*60;
      var total=S.focus.mode==='work'?WORK:REST;
      S.focus.startedAt=Date.now()-S.focus.secs*1000;
      S.focus.running=true;
      S.focus.interval=setInterval(function(){
        var elapsed=(Date.now()-S.focus.startedAt)/1000|0;
        if(elapsed>=total){
          clearInterval(S.focus.interval);
          S.focus.running=false;
          S.focus.secs=0;
          if(S.focus.mode==='work'){
            S.focus.sessions++;
            S.xp+=10;
            DB.set('focus:'+toDay(),{sessions:S.focus.sessions});
            save();
            renderHeader();
            // Ask what was done
            S.focus._askNote=true;
          }
          S.focus.mode=S.focus.mode==='work'?'rest':'work';
          renderPage();
          if(S.focus._askNote){
            S.focus._askNote=false;
            var note=prompt('Session done! +10 XP\nWhat did you work on? (optional)');
            if(note&&note.trim()){
              S.pomodoroNotes=(S.pomodoroNotes||[]).concat([{t:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),n:note.trim()}]);
              DB.set('pomodoroNotes:'+toDay(),S.pomodoroNotes);
            }
          }
          return;
        }
        // Update timer display only
        if(document.getElementById('focStart')){
          var left=total-elapsed;
          var pct2=Math.round(elapsed/total*100);
          var tEl=document.querySelector('#page svg circle:last-child');
          var timeEl=document.querySelector('#page .foctime');
          // Re-render the timer section
          renderPage();
        }
      },1000);
      renderPage();
    }
  };

    clearInterval(S.focus.interval);

    renderPage();

  // Skill Drill

  // Workout AI
  var wai=document.getElementById('workoutAIBtn');

    S.workoutAILoading=true;renderPage();

    var sys='You are Akshat personal Fitness Coach. He just logged this workout: '+summary+'. Give 3-4 sentences: was the volume adequate, what muscle groups need more work, one specific improvement for next session. Real science, no fluff.';

  // Meal AI
  var mai=document.getElementById('mealAIBtn');
  if(mai&&!S.mealAILoading)mai.onclick=async function(){

    var tot=meals.reduce(function(s,m){return{p:s.p+(m.protein||0),c:s.c+(m.calories||0)}},{p:0,c:0});
    var list=meals.map(function(m){return m.name+'('+m.protein+'g protein, '+m.calories+'kcal)'}).join(', ');
    var sys='You are Dr. Aryan, Akshat personal doctor. He ate today: '+list+'. Total: '+tot.p+'g protein, '+tot.c+' kcal. His target is 160g protein for muscle gain. He trains 6x/week and eats home-cooked Indian food (dal, roti, rice, sabzi, curd, eggs, paneer). Give 3-4 sentences: did he hit targets, what is missing, what to eat in next meal from typical Indian home food. Direct, no disclaimers.';
    try{
      var r=await callAI([{role:'user',content:'Review my nutrition today.'}],sys,false,null);
      S.mealAIInsight=r;
    }catch(e){S.mealAIInsight='Error: '+e.message;}
    S.mealAILoading=false;renderPage();
  };
  // Meal quick-add chips (one-tap, no guessing needed)
  document.querySelectorAll('.mealQuick').forEach(function(b){
    b.onclick=function(){
      var q=MEAL_QUICK[parseInt(b.dataset.qi)];
      if(!q)return;
      S.mealLog=(S.mealLog||[]).concat([{id:Date.now(),name:q.n,protein:q.p,calories:q.c}]);
      DB.set('mealLog:'+toDay(),S.mealLog);renderPage();
    };
  });
  // AI estimate for anything not on the quick-add list
  var meb=document.getElementById('mealEstimateBtn');
  // Was `if(meb&&!S.mealEstLoading)meb.onclick=...` — that meant if this
  // button ever got (re)rendered while a loading state was true, it ended up
  // with NO click handler attached at all, so clicking it silently did
  // nothing forever after. Always bind; guard double-submission inside the
  // handler instead, where it belongs.
  if(meb)meb.onclick=async function(){
    if(S.mealEstLoading)return;
    var mn=document.getElementById('mealName');
    var food=mn?mn.value.trim():'';
    S.mealEstError='';
    if(!food){S.mealEstError='Type the food item first (e.g. "2 roti + dal + sabzi")';renderPage();return;}
    S.mealEstLoading=true;renderPage();
    // renderPage() above just wiped mealName back to empty too (same root
    // cause as the protein/calories bug — every input in this section is
    // uncontrolled, so any render destroys and recreates it blank). Restore
    // what the user typed immediately so it doesn't look like their entry
    // vanished the instant they clicked Estimate.
    var mnAfter=document.getElementById('mealName');if(mnAfter)mnAfter.value=food;
    var sys='You are a nutrition estimator for home-cooked Indian food. The description may include a quantity (e.g. "3 kachodi", "2 roti + dal") — scale your estimate to the TOTAL amount described, not a single generic serving; don\'t just return one small serving\'s worth regardless of the count given. Use these as rough per-unit reference points, don\'t undercount fried food: roti ~120kcal/3g protein each; dal, 1 katori ~150kcal/9g protein; rice, 1 cup ~200kcal/4g protein; sabzi, 1 katori ~100kcal/3g protein; deep-fried snacks (kachori, samosa, pakora) ~150-200kcal/2-4g protein EACH; paneer/chicken/egg dishes ~200-300kcal/15-20g protein per serving. Respond with ONLY a JSON object for the TOTAL described amount, no markdown, no explanation: {"protein":NUMBER,"calories":NUMBER}';
    try{
      var r=await callAI([{role:'user',content:'Estimate: '+food}],sys,false,null);
      var clean=r.replace(/```json|```/g,'').trim();
      var parsed=JSON.parse(clean);
      // The model sometimes returns numbers as strings or with units attached
      // (e.g. "45g", "550 kcal") even when told to return plain numbers —
      // a strict typeof==='number' check silently discarded those instead of
      // erroring, so the button would spin then land back with nothing filled
      // and no message at all. Coerce by stripping non-numeric characters first.
      var protNum=typeof parsed.protein==='number'?parsed.protein:parseFloat(String(parsed.protein||'').replace(/[^0-9.]/g,''));
      var calNum=typeof parsed.calories==='number'?parsed.calories:parseFloat(String(parsed.calories||'').replace(/[^0-9.]/g,''));
      var gotAny=!isNaN(protNum)||!isNaN(calNum);
      if(!gotAny)throw new Error('unrecognized response format: '+clean.slice(0,80));
      S.mealEstLoading=false;renderPage();
      // renderPage() just rebuilt the ENTIRE section's innerHTML from scratch —
      // any element reference (and any .value set on it) from before this line
      // has already been destroyed. Setting mp.value BEFORE renderPage() was
      // the actual bug: the number would be set for a split second, then
      // immediately thrown away when the DOM got replaced, so it never
      // visibly appeared. Fetch fresh references to the newly-created inputs
      // AFTER the render instead, so the values actually stick.
      var mp=document.getElementById('mealProt');var mc=document.getElementById('mealCal');
      if(mp&&!isNaN(protNum))mp.value=Math.round(protNum);
      if(mc&&!isNaN(calNum))mc.value=Math.round(calNum);
      var mnFinal=document.getElementById('mealName');if(mnFinal)mnFinal.value=food;
      return;
    }catch(e){S.mealEstError='Could not estimate ('+e.message+') — try describing it more simply, or enter numbers manually.';}
    S.mealEstLoading=false;renderPage();
    var mnErr=document.getElementById('mealName');if(mnErr)mnErr.value=food;
  };
  // Body Metrics bindings

    [{id:'bmWeight',f:'weight'},{id:'bmChest',f:'chest'},{id:'bmWaist',f:'waist'},{id:'bmArm',f:'arm'},{id:'bmShoulder',f:'shoulder'},{id:'bmCalf',f:'calf'}].forEach(function(m){

  };
  // Meal tracker bindings
  var am=document.getElementById('addMeal');
  if(am)am.onclick=function(){
    var mn=document.getElementById('mealName');var mp=document.getElementById('mealProt');var mc=document.getElementById('mealCal');
    var sq=document.getElementById('mealSaveQuick');
    if(!mn||!mn.value.trim())return;

      renderPage();
      return;
    }
    var name=mn.value.trim();var prot=parseInt(mp.value)||0;var cal=parseInt(mc.value)||0;
    S.mealLog=(S.mealLog||[]).concat([{id:Date.now(),name:name,protein:prot,calories:cal}]);
    DB.set('mealLog:'+toDay(),S.mealLog);
    if(sq&&sq.checked){
      S.customFoods=(S.customFoods||[]).filter(function(f){return f.n.toLowerCase()!==name.toLowerCase();}).concat([{n:name,p:prot,c:cal}]);
      DB.set('customFoods',S.customFoods);
    }
    S.mealEstError='';
    mn.value='';mp.value='';mc.value='';if(sq)sq.checked=false;
    renderPage();
  };
  document.querySelectorAll('.delm').forEach(function(b){
    b.onclick=function(){S.mealLog=S.mealLog.filter(function(m){return String(m.id)!==String(b.dataset.mid)});DB.set('mealLog:'+toDay(),S.mealLog);renderPage();};
  });
  // Custom (user-saved) home foods — one-tap log + per-chip delete
  document.querySelectorAll('.customFoodQuick').forEach(function(b){
    b.onclick=function(){
      var q=(S.customFoods||[])[parseInt(b.dataset.ci)];
      if(!q)return;
      S.mealLog=(S.mealLog||[]).concat([{id:Date.now(),name:q.n,protein:q.p,calories:q.c}]);
      DB.set('mealLog:'+toDay(),S.mealLog);renderPage();
    };
  });
  document.querySelectorAll('.customFoodDel').forEach(function(b){
    b.onclick=function(){
      var ci=parseInt(b.dataset.ci);
      S.customFoods=(S.customFoods||[]).filter(function(_,i){return i!==ci;});
      DB.set('customFoods',S.customFoods);renderPage();
    };
  });
  // Share progress card
  var sc=document.getElementById('shareCard');
  if(sc)sc.onclick=function(){
    var today=new Date();
    var weekDays2=[];
    for(var i=6;i>=0;i--){
      var d=new Date();d.setDate(d.getDate()-i);
      var dk=toLocalDate(d);
      var dd2=DB.get('day:'+dk);
      var sl2=DB.get('sleep:'+dk);
      var done2=dd2?Object.keys(dd2.c||{}).filter(function(k){return(dd2.c||{})[k]}).length:0;
      weekDays2.push({done:done2,total:S.habits.length,sl:sl2?sl2.q:0});
    }
    var avgH=Math.round(weekDays2.reduce(function(s,d){return s+(d.total>0?d.done/d.total*100:0)},0)/7);
    var avgSl=(weekDays2.filter(function(d){return d.sl>0}).reduce(function(s,d){return s+d.sl},0)/(weekDays2.filter(function(d){return d.sl>0}).length||1)).toFixed(1);
    var lvl=Math.floor(S.xp/100);
    var lvlN=['Beginner','Learner','Builder','Developer','Engineer','Expert','Master','Legend'][Math.min(lvl,7)];
    var bar=weekDays2.map(function(d){var p=d.total>0?Math.round(d.done/d.total*100):0;return p>=80?'█':p>=50?'▓':p>0?'░':'·';}).join('');
    var nl='\n';
    var text='AKSHAT OS | Week of '+today.toLocaleDateString('en-IN',{month:'short',day:'numeric'})+nl+nl+

function scheduleNotifs(){
  if(!('Notification' in window)||!S.notifTime.enabled)return;
  if(window._notifTimers){window._notifTimers.forEach(function(t){clearTimeout(t)});window._notifTimers=[];}
  window._notifTimers=[];
  function notify(title,body,tag){
    if(Notification.permission!=='granted')return;
    var opts={body:body,tag:tag||'akshat-os',icon:'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>',badge:'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>'};
    if(window._swReg&&window._swReg.active){
      window._swReg.showNotification(title,opts);
    }else{
      new Notification(title,opts);
    }
  }
  function scheduleAt(h,m,fn){
    var now=new Date();var target=new Date();
    target.setHours(h,m,0,0);
    if(target<=now)target.setDate(target.getDate()+1);
    var t=setTimeout(function(){fn();scheduleAt(h,m,fn);},target-now);
    window._notifTimers.push(t);
  }
  // Morning reminder
  var mp=S.notifTime.morning.split(':');
  scheduleAt(parseInt(mp[0]),parseInt(mp[1]),function(){
    var undone=S.habits.filter(function(h){return!S.checked[h.id]});
    var msg=undone.length?undone.length+' habits pending: '+undone.slice(0,3).map(function(h){return h.lbl}).join(', '):'All habits done! You are on fire 🔥';
    notify('Good morning, Akshat! 🌅',msg,'morning');
  });
  // Evening check-in
  var ep=S.notifTime.evening.split(':');
  scheduleAt(parseInt(ep[0]),parseInt(ep[1]),function(){
    var done=S.habits.filter(function(h){return S.checked[h.id]==='done'}).length;
    notify('Evening Check-in 🌙',done+'/'+S.habits.length+' habits done. Close the day properly.','evening');
  });
  // Deadline reminders - check every hour
  function checkDeadlines(){
    var today=new Date();today.setHours(0,0,0,0);
    S.deadlines.forEach(function(d){
      var dd=new Date(d.date);dd.setHours(0,0,0,0);
      var diff=Math.ceil((dd-today)/(864e5));
      if(diff===1)notify('Tomorrow: '+d.emoji+' '+d.title,'Deadline tomorrow — are you ready?','dl-'+d.id);
      if(diff===0)notify('TODAY: '+d.emoji+' '+d.title,'This deadline is TODAY!','dl-today-'+d.id);
    });
  }
  checkDeadlines();
  var hourCheck=setInterval(checkDeadlines,3600000);
  window._notifTimers.push(hourCheck);
  // Habit reminder at 10PM if not all done
  scheduleAt(22,0,function(){
    var undone=S.habits.filter(function(h){return!S.checked[h.id]});
    if(undone.length>0){
      notify('Habits incomplete! ⚠️',undone.length+' habits left: '+undone.slice(0,3).map(function(h){return h.lbl}).join(', '),'habit-reminder');
    }
  });
  // 9PM streak protection
  scheduleAt(21,0,function(){
    var undone=S.habits.filter(function(h){return!S.checked[h.id]});
    if(undone.length>0){
      notify('🔥 Streak at risk!',''+undone.length+' habits left. 3 hours to save your '+S.streak+'-day streak.','streak-protect');
    }
  });
  // Calendar event reminders
  function checkCalendarEvents(){
    var now=new Date();
    (S.calendar||[]).forEach(function(ev){
      if(!ev.time||!ev.date)return;
      var evTime=new Date(ev.date+'T'+ev.time);
      var diff=evTime-now;
      if(diff>0&&diff<900000){// within 15 min
        notify('📅 '+ev.title+' in 15 min',ev.note||ev.cat,'cal-'+ev.id);
      }
    });
  }
  var calCheck=setInterval(checkCalendarEvents,300000);// every 5 min
  window._notifTimers.push(calCheck);
  // 9PM non-negotiable check
  scheduleAt(21,0,function(){
    var undoneNN=(S.nonneg||[]).filter(function(n){return!n.done});
    if(undoneNN.length>0){
      notify('🔴 Non-Negotiables undone!',undoneNN.map(function(n){return n.text}).join(', ')+' — must happen today.','nonneg-alert');
    }
  });
  var acctCheck=setInterval(checkCalendarAccountability,600000);// every 10 min
  window._notifTimers.push(acctCheck);
  // Accountability partner — Ayanokoji checks in at 8AM, 2PM, 8PM
  [8,14,20].forEach(function(hr){
    scheduleAt(hr,0,function(){
      if(!S.acctPartner.enabled)return;
      if(S.acctPartner.lastDate===toDay()&&S.acctPartner.lastMsg)return;
      var undone=S.habits.filter(function(h){return!S.checked[h.id]});
      var msgs8=['Another day. What have you actually done so far?','Morning. Habits pending: '+undone.length+'. Clock is running.','You woke up. Good. Now what?'];
      var msgs14=['Midday check. '+undone.length+' habits undone. Still time — barely.','Half the day gone. What do you have to show for it?','2PM. Are you ahead or behind? Be honest.'];
      var msgs20=['Evening. '+undone.length+' habits left. You know what to do.','Most people quit at night. Are you most people?','8PM. Shadow Protocol opens in 2 hours. What will you write?'];
      var pool=hr===8?msgs8:hr===14?msgs14:msgs20;
      var msg=pool[Math.floor(Math.random()*pool.length)];
      notify('🧊 Ayanokoji',msg,'acct-'+hr);
      S.acctPartner.lastMsg=msg;S.acctPartner.lastDate=toDay();DB.set('acctPartner',S.acctPartner);
    });
  });
  // Sunday smart recap
  scheduleAt(20,0,function(){
    if(new Date().getDay()===0&&!S.smartRecap.text)genSmartRecap();
  });
  scheduleAt(23,0,function(){
    var undone=S.habits.filter(function(h){return!S.checked[h.id]});
    if(undone.length>0)notify('📝 Why didn\'t you finish?',undone.length+' habits undone. Log why before sleep.','fail-log');
  });
  // Daily Challenge — generate at 7AM if not set today
  scheduleAt(7,0,function(){
    if(!S.dailyChallenge.text||S.dailyChallenge.date!==toDay())genDailyChallenge();
  });
  // Streak insurance at 11PM
  scheduleAt(23,30,function(){
    var undone=S.habits.filter(function(h){return S.checked[h.id]!=='done';});
    if(undone.length>0&&S.streak>0&&!S.streakInsuranceShown){S.streakInsuranceShown=true;renderPage();}
  });
  // Auto war report Sunday 8PM
  scheduleAt(20,0,function(){
    if(new Date().getDay()===0&&(!S.smartRecap.text||S.smartRecap.date!==toDay())){genSmartRecap();notify('📋 Weekly Recap','Your War Report is ready.','war-report');}
  });
  // Load deferred boot state now that scheduleAt is defined
  var hd2=DB.get('habitDNA:'+toDay());if(hd2)S.habitDNA={result:hd2,date:toDay(),loading:false};
  var fc2=DB.get('fridayChat');if(fc2)S.fridayChat=fc2;
  (function(){var quotes=[];for(var qi=1;qi<=60;qi++){var d=new Date();d.setDate(d.getDate()-qi);var dk=toLocalDate(d);var je=DB.get('journal:'+dk);if(je&&je.q1&&je.q1.length>20)quotes.push(je.q1);var shd2=DB.get('shadow:'+dk);if(shd2&&shd2.q1&&shd2.q1.length>20)quotes.push(shd2.q1);}if(quotes.length){S.dailyOwnQuote=quotes[Math.floor(new Date().getDate()%quotes.length)];}})();
}

var DRILL_TOPICS=['JavaScript','React','CSS','Node.js','Git','HTML','Python','Data Structures','System Design','DSA'];

async function generateDrill(){
  S.drillLoading=true;S.skillDrill.questions=[];S.skillDrill.answers={};S.skillDrill.submitted=false;
  renderPage();
  var sys='You are a coding interview expert. Generate exactly 3 coding/concept questions for the topic: '+S.skillDrill.topic+'. Each question should be practical and interview-relevant. Respond ONLY with a JSON array of exactly 3 objects, no other text, no markdown, just the raw JSON array. Format: [{"q":"question text","type":"mcq or short","options":["A","B","C","D"],"answer":"correct answer or letter","explanation":"why this is correct"}]. For short answer questions, options can be an empty array [].';
  try{
    var raw=await callAI([{role:'user',content:'Generate 3 '+S.skillDrill.topic+' questions. Return only the JSON array, no other text.'}],sys,false,null);
    // Clean JSON
    var cleaned=raw.replace(/```json|```/g,'').trim();
    var start=cleaned.indexOf('[');var end=cleaned.lastIndexOf(']');
    if(start>=0&&end>start)cleaned=cleaned.slice(start,end+1);
    var qs=JSON.parse(cleaned);
    S.skillDrill.questions=qs.slice(0,3);
    DB.set('skillDrill:'+toDay(),S.skillDrill);
  }catch(e){
    S.skillDrill.questions=[{q:'Could not generate questions: '+e.message+'. Try again.',type:'short',options:[],answer:'',explanation:''}];
  }
  S.drillLoading=false;renderPage();
}

function bindMissionModal(){
  document.getElementById('closeMission').onclick=function(){renderPage();};
  var fields={msGoal:'goal',msWhy:'why',msM1:'m1',msM2:'m2',msM3:'m3',msWeek:'week',msToday:'today'};
  Object.keys(fields).forEach(function(id){
    var el=document.getElementById(id);
    if(el)el.oninput=function(){
      S.mission[fields[id]]=el.value;
      if(fields[id]==='today')S.mission.todaySetOn=toDay();
    };
  });
  document.getElementById('saveMission').onclick=function(){
    S.mission.set=true;
    DB.set('mission',S.mission);

function bindEveningModal(){
  document.getElementById('closeEvening').onclick=function(){S.showEveningModal=false;renderPage();};
  document.querySelectorAll('.evfoc').forEach(function(b){
    b.onclick=function(){
      S.evening.focus=parseInt(b.dataset.n);
      DB.set('evening:'+toDay(),S.evening);
      // Previously built fresh HTML here but never used it — the click was
      // saved correctly but the selected emoji never visually highlighted.
      // Update the existing overlay's own content in place instead of going
      // through renderPage() (which would trigger the duplicate-overlay
      // issue this whole function was just fixed to avoid).
      var ovEl=document.getElementById('eveningOverlay');
      if(ovEl){ovEl.innerHTML=buildEveningModal();bindEveningModal();}
    };
  });
  var ew=document.getElementById('evWin');if(ew)ew.oninput=function(){S.evening.win=ew.value;DB.set('evening:'+toDay(),S.evening);};
  var er=document.getElementById('evReg');if(er)er.oninput=function(){S.evening.regret=er.value;DB.set('evening:'+toDay(),S.evening);};
  var et=document.getElementById('evTmr');if(et)et.oninput=function(){S.evening.tomorrow=et.value;DB.set('evening:'+toDay(),S.evening);};
  document.getElementById('saveEvening').onclick=function(){
    S.evening.done=true;
    // Set tomorrow main task from evening check-in. Date-stamped so it
    // self-expires after 1 day instead of lingering indefinitely (this is
    // what let an old value survive being manually cleared — a Gist sync
    // pull would just restore whatever was last pushed since there was no
    // way to tell a fresh value from a week-old one).
    if(S.evening.tomorrow){
      DB.set('eveningTmr',{task:S.evening.tomorrow,setOn:toDay()});
    }else{
      DB.set('eveningTmr',{task:'',setOn:toDay()});
    }
    DB.set('evening:'+toDay(),S.evening);
    S.showEveningModal=false;
    renderPage();
  };
}

function bindCapturePanel(){
  var ci=document.getElementById('capInput');
  var ac=document.getElementById('addCap');
  var cc=document.getElementById('closeCapture');
  if(cc)cc.onclick=function(){
    S.showCapture=false;
    var p=document.getElementById('capturePanel');
    if(p)p.remove();
  };
  if(ac)ac.onclick=function(){
    if(!ci||!ci.value.trim())return;
    var now=new Date();
    S.capture=(S.capture||[]).concat([{id:Date.now(),t:ci.value.trim(),d:now.toLocaleDateString()+' '+now.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}]);
    DB.set('capture',S.capture);
    ci.value='';
    // Re-render just the panel
    var p=document.getElementById('capturePanel');
    if(p){p.innerHTML=buildCapturePanel();bindCapturePanel();}
  };
  if(ci)ci.onkeydown=function(e){if(e.key==='Enter')ac.onclick();};
  document.querySelectorAll('.delcap').forEach(function(b){
    b.onclick=function(){
      S.capture=S.capture.filter(function(c){return String(c.id)!==String(b.dataset.cid)});
      DB.set('capture',S.capture);
      var p=document.getElementById('capturePanel');
      if(p){p.innerHTML=buildCapturePanel();bindCapturePanel();}
    };
  });
}

// ── BODY METRICS TRACKER ─────────────────────────────────────────────────────
function buildMetricsProgress(){
  if(S.bodyMetrics.length<2)return'';
  var first=S.bodyMetrics[0];
  var last=S.bodyMetrics[S.bodyMetrics.length-1];
  var fields=[{f:'weight',l:'Weight',less:false},{f:'chest',l:'Chest',less:false},{f:'waist',l:'Waist',less:true},{f:'arm',l:'Arm',less:false}];
  var rows=fields.filter(function(m){return first[m.f]&&last[m.f];}).map(function(m){
    var diff=(parseFloat(last[m.f])-parseFloat(first[m.f])).toFixed(1);
    var improved=m.less?parseFloat(diff)<0:parseFloat(diff)>0;
    var col=improved?'#10b981':'#ef4444';
    return'<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:12px">'+
      '<span style="color:#9ca3af">'+m.l+'</span>'+
      '<span style="color:'+col+';font-weight:700">'+(parseFloat(diff)>0?'+':'')+diff+' since start</span>'+
    '</div>';
  });
  if(!rows.length)return'';
  return'<div style="font-size:9.5px;font-weight:700;color:#374151;text-transform:uppercase;letter-spacing:1px;margin-top:10px;margin-bottom:7px">Progress vs start</div>'+rows.join('');
}

function getHabitStats(){
  var days=[];
  for(var i=13;i>=0;i--){
    var d=new Date();d.setDate(d.getDate()-i);
    var dk=toLocalDate(d);
    var dd=DB.get('day:'+dk);
    days.push({date:dk,checked:dd?dd.c||{}:{}});
  }
  var daysWithData=days.filter(function(d){return Object.keys(d.checked).length>0});
  var rates=[];
  S.habits.forEach(function(h){
    var done=daysWithData.filter(function(d){return d.checked[h.id]}).length;
    rates.push({id:h.id,lbl:h.lbl,rate:daysWithData.length?Math.round(done/daysWithData.length*100):0,done:done,total:daysWithData.length});
  });
  return{days:daysWithData,rates:rates.sort(function(a,b){return b.rate-a.rate})};
}

function buildHabitInsights(){
  var st=getHabitStats();
  var daysWithData=st.days;var sorted=st.rates;
  // 7-day streak data
  var streakDays=[];
  for(var i=6;i>=0;i--){
    var d2=new Date();d2.setDate(d2.getDate()-i);
    var dk2=toLocalDate(d2);
    var dd2=DB.get('day:'+dk2);
    var total=S.habits.length;
    var done2=dd2?Object.keys(dd2.c||{}).filter(function(k){return(dd2.c||{})[k]}).length:0;
    var dayName=['S','M','T','W','T','F','S'][d2.getDay()];
    streakDays.push({label:i===0?'T':dayName,pct:total>0?Math.round(done2/total*100):0,done:done2,total:total});
  }
  if(daysWithData.length<3){
    return'<div style="background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:13px;margin-bottom:12px">'+
      '<div style="font-size:10px;font-weight:700;color:#374151;text-transform:uppercase;letter-spacing:1.2px;margin-bottom:8px">📊 Habit Insights</div>'+
      '<div style="background:rgba(251,146,60,.06);border:1px solid rgba(251,146,60,.15);border-radius:10px;padding:10px 12px;font-size:12px;color:#d97706;text-align:center">'+
        'Track habits for '+Math.max(0,3-daysWithData.length)+' more day'+(daysWithData.length===2?'':'s')+' to unlock insights.'+
        '<div style="font-size:10.5px;color:#6b7280;margin-top:4px">Your consistency builds here.</div>'+
      '</div>'+
      // Show the 7-day visual even with less data
      '<div style="margin-top:11px">'+
        '<div style="display:flex;align-items:flex-end;gap:4px;height:48px;margin-bottom:5px">'+
          streakDays.map(function(d){
            var col=d.pct>=80?'#10b981':d.pct>=50?'#f59e0b':d.pct>0?'#ef4444':'#1f2937';
            var h=d.pct>0?Math.max(6,Math.round(d.pct/100*44)):4;
            return'<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px">'+
              '<div style="width:100%;height:'+h+'px;background:'+col+';border-radius:3px 3px 0 0"></div>'+
              '<div style="font-size:8px;color:#374151">'+d.label+'</div>'+
            '</div>';
          }).join('')+
        '</div>'+
      '</div>'+
    '</div>';
  }
  var best=sorted[0];var worst=sorted[sorted.length-1];
  var weekAvg=Math.round(streakDays.reduce(function(s,d){return s+d.pct},0)/7);
  return'<div style="background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:13px;margin-bottom:12px">'+
    '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">'+
      '<div style="font-size:10px;font-weight:700;color:#374151;text-transform:uppercase;letter-spacing:1.2px">📊 Habit Insights</div>'+
      '<div style="font-size:11px;color:#fb923c;font-weight:700">'+weekAvg+'% this week</div>'+
    '</div>'+
    // 7-day bar chart
    '<div style="display:flex;align-items:flex-end;gap:4px;height:52px;margin-bottom:12px">'+
      streakDays.map(function(d){
        var col=d.pct>=80?'#10b981':d.pct>=50?'#f59e0b':d.pct>0?'#ef4444':'#1f2937';
        var h=d.pct>0?Math.max(6,Math.round(d.pct/100*48)):4;
        var isToday=d.label==='T'&&streakDays.indexOf(d)===6;
        return'<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px">'+
          '<div style="font-size:8px;color:'+col+';font-weight:700">'+(d.pct>0?d.pct+'%':'')+'</div>'+
          '<div style="width:100%;height:'+h+'px;background:'+col+';border-radius:3px 3px 0 0;'+(isToday?'box-shadow:0 0 6px '+col+'80':'')+'"></div>'+
          '<div style="font-size:8px;color:'+(isToday?'#fb923c':'#374151')+';font-weight:'+(isToday?700:400)+'">'+d.label+'</div>'+
        '</div>';
      }).join('')+
    '</div>'+
    // Per-habit bars
    sorted.map(function(h){
      var col=h.rate>=80?'#10b981':h.rate>=50?'#f59e0b':'#ef4444';
      return'<div style="margin-bottom:9px">'+
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">'+
          '<span style="font-size:12px;color:#e2e8f0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-right:8px">'+esc(h.lbl)+'</span>'+
          '<span style="font-size:11px;font-weight:700;color:'+col+';white-space:nowrap">'+h.done+'/'+h.total+' ('+h.rate+'%)</span>'+
        '</div>'+
        '<div style="height:6px;background:rgba(255,255,255,.05);border-radius:6px;overflow:hidden">'+
          '<div style="height:100%;width:'+h.rate+'%;background:linear-gradient(90deg,'+col+','+col+'99);border-radius:6px;transition:width .5s"></div>'+
        '</div>'+
      '</div>';
    }).join('')+
    // Summary insight
    '<div style="margin-top:10px;padding:10px 12px;background:rgba(251,146,60,.06);border:1px solid rgba(251,146,60,.15);border-radius:11px">'+
      '<div style="font-size:10px;font-weight:700;color:#fb923c;text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px">AI Pattern</div>'+
      (S.habitAIInsight?
        '<div style="font-size:12px;color:#d1d5db;line-height:1.6">'+esc(S.habitAIInsight)+'</div>'
      :
        '<div style="font-size:12px;color:#6b7280;margin-bottom:7px">'+
          (best?'Best: '+esc(best.lbl)+' ('+best.rate+'%)':'—')+
          (worst&&worst.id!==best.id?' · Weakest: '+esc(worst.lbl)+' ('+worst.rate+'%)':'')+
        '</div>'+
        '<button id="habitAIBtn" style="background:rgba(251,146,60,.12);border:1px solid rgba(251,146,60,.25);border-radius:8px;padding:6px 12px;color:#fb923c;font-size:11px;font-weight:700">'+
          (S.habitInsightLoading?'Analyzing...':'Get AI insight on my habits →')+
        '</button>'
      )+
    '</div>'+
  '</div>';
}

  document.getElementById('ncDesc').oninput=function(e){window._newChar.desc=e.target.value;};
  document.getElementById('ncSys').oninput=function(e){window._newChar.sys=e.target.value;};
  document.getElementById('ncQ1').oninput=function(e){window._newChar.q1=e.target.value;};
  document.getElementById('ncQ2').oninput=function(e){window._newChar.q2=e.target.value;};
  document.getElementById('ncQ3').oninput=function(e){window._newChar.q3=e.target.value;};
  document.querySelectorAll('.ncemoji').forEach(function(el){el.onclick=function(){window._newChar.emoji=el.dataset.e;renderPage();};});
  document.querySelectorAll('.nccolor').forEach(function(el){el.onclick=function(){window._newChar.color=el.dataset.c;renderPage();};});
  document.getElementById('saveCharBtn').onclick=function(){
    var nc=window._newChar;
    if(!nc.name.trim()||!nc.sys.trim()){toast('Name and Personality are required!','info');return;}
    var id='custom_'+Date.now();
    var qs=[];
    if(nc.q1.trim())qs.push({l:nc.q1.slice(0,20),t:nc.q1});
    if(nc.q2.trim())qs.push({l:nc.q2.slice(0,20),t:nc.q2});
    if(nc.q3.trim())qs.push({l:nc.q3.slice(0,20),t:nc.q3});
    if(qs.length===0)qs=[{l:'Ask anything',t:'Tell me something I should know'}];
    var newChar={
      id:id,name:nc.name,emoji:nc.emoji,color:nc.color,
      grad:'linear-gradient(135deg,'+nc.color+','+nc.color+'99)',
      desc:nc.desc||'Custom character',sys:nc.sys,qs:qs
    };
    CHARS.push(newChar);
    S.customChars=S.customChars.concat([newChar]);
    DB.set('customChars',S.customChars);
    S.chats[id]=[{r:'a',t:'Hello! I am '+nc.name+'. '+nc.desc+' — ask me anything.'}];
    window._newChar={name:'',emoji:'🤖',color:'#fb923c',desc:'',sys:'',q1:'',q2:'',q3:''};
    S.showCharBuilder=false;
    S.chatId=id;S.chatView='chat';
    renderPage();
  };
}

function buildOnboarding(){
  if(document.getElementById('onboardOverlay'))return;
  var ob=DB.get('onboarding')||{started:null,dismissed:false,lastSeen:null};
  if(ob.dismissed)return;
  var now=toDay();
  if(!ob.started){ob.started=now;DB.set('onboarding',ob);}
  var startD=new Date(ob.started);var nowD=new Date(now);
  var day=Math.floor((nowD-startD)/(864e5))+1;
  if(day>21){ob.dismissed=true;DB.set('onboarding',ob);return;}
  if(ob.lastSeen===now)return;// already shown today

}

function renderCmdResults(q){

  cpFiltered=q?CMD_LIST.filter(function(c){return(c.lb+' '+c.grp).toLowerCase().indexOf(q)!==-1;}):CMD_LIST;

  var lastGrp='';
  wrap.innerHTML=cpFiltered.map(function(c,i){

    return hdr+'<div class="cmdItem" data-i="'+i+'" style="display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;cursor:pointer;background:'+(i===cpIdx?'rgba(251,146,60,.14)':'transparent')+'"><span style="font-size:16px;flex-shrink:0">'+c.ic+'</span><span style="font-size:13.5px;color:'+(i===cpIdx?'#fb923c':'#d1d5db')+';font-weight:'+(i===cpIdx?'700':'500')+'">'+esc(c.lb)+'</span></div>';
  }).join('');
  document.querySelectorAll('.cmdItem').forEach(function(b){
    b.onclick=function(){runCmd(parseInt(b.dataset.i));};
    b.onmouseenter=function(){cpIdx=parseInt(b.dataset.i);highlightCmd();};
  });
}
function highlightCmd(){
  document.querySelectorAll('.cmdItem').forEach(function(b){
    var i=parseInt(b.dataset.i);
    b.style.background=i===cpIdx?'rgba(251,146,60,.14)':'transparent';
    var sp=b.querySelector('span:last-child');
    sp.style.color=i===cpIdx?'#fb923c':'#d1d5db';
    sp.style.fontWeight=i===cpIdx?'700':'500';
  });
  var el=document.querySelector('.cmdItem[data-i="'+cpIdx+'"]');
  if(el)el.scrollIntoView({block:'nearest'});
}
function runCmd(i){
  var c=cpFiltered[i];
  if(!c)return;
  closeCmdPalette();
  c.run();
}
function cmdKeyHandler(e){
  if(e.key==='Escape'){e.preventDefault();closeCmdPalette();return;}
  if(e.key==='ArrowDown'){e.preventDefault();cpIdx=Math.min(cpFiltered.length-1,cpIdx+1);highlightCmd();return;}
  if(e.key==='ArrowUp'){e.preventDefault();cpIdx=Math.max(0,cpIdx-1);highlightCmd();return;}
  if(e.key==='Enter'){e.preventDefault();runCmd(cpIdx);return;}
}
document.addEventListener('keydown',function(e){
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){
    e.preventDefault();
    if(document.getElementById('cmdPalette'))closeCmdPalette();else openCmdPalette();
  }
});

// ── SERVICE WORKER REGISTRATION ───────────────────────────────────────────────
if('serviceWorker' in navigator && location.hostname==='akshat-neeraj.github.io'){
  navigator.serviceWorker.register('/Os/sw.js').then(function(reg){
    window._swReg=reg;
    // Periodic background sync: gentle daily streak nudge.
    // Only works as an installed PWA on browsers that support it (mainly
    // Chrome/Android) — no-op (silently rejects) everywhere else.
    if('periodicSync' in reg && navigator.permissions){
      navigator.permissions.query({name:'periodic-background-sync'}).then(function(status){
        if(status.state==='granted'){
          reg.periodicSync.register('daily-nudge',{minInterval:24*60*60*1000}).catch(function(){});
        }
      }).catch(function(){});
    }
  }).catch(function(){});
  // The service worker asks us to retry a Gist push once connectivity returns
  // (registered via 'gist-sync-retry' background sync after a failed push).
  navigator.serviceWorker.addEventListener('message',function(e){
    if(e.data&&e.data.type==='RUN_SYNC'&&typeof syncPush==='function')syncPush();
  });
}// show after app loads
